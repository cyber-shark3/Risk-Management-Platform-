services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: risk_platform
      POSTGRES_USER: risk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U risk_user -d risk_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install -e packages/risk_engine && pip install -r services/api/requirements.txt && uvicorn app.main:app --app-dir services/api --host 0.0.0.0 --port 8000"
    volumes: [".:/workspace"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://risk_user:${POSTGRES_PASSWORD:-local-dev-change-me}@db:5432/risk_platform
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    image: node:22-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev"
    volumes: [".:/workspace", "web_node_modules:/workspace/apps/web/node_modules"]
    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  web_node_modules:
