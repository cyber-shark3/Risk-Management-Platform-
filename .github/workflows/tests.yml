name: Tests

on:
  push:
  pull_request:

jobs:
  risk-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/risk_engine/pyproject.toml
      - name: Install risk engine
        run: python -m pip install -e "packages/risk_engine[dev]"
      - name: Run risk engine tests
        run: python -m pytest packages/risk_engine/tests -q
      - name: Lint risk engine
        run: ruff check packages/risk_engine
