name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/risk_engine/pyproject.toml
            services/api/requirements.txt
      - name: Install risk engine and API dependencies
        run: |
          python -m pip install -e "packages/risk_engine[dev]"
          python -m pip install -r services/api/requirements.txt
      - name: Run engine and API tests
        env:
          PYTHONPATH: packages/risk_engine/src:services/api
          SECRET_KEY: test-secret-key-not-for-production
          DATABASE_URL: sqlite://
        run: python -m pytest packages/risk_engine/tests services/api/tests -q
      - name: Lint risk engine
        run: ruff check packages/risk_engine
